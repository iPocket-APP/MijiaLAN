name: Native macOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      run_id:
        value: ${{ jobs.build.outputs.run_id }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-native-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Identify compiler and SDK
        id: toolchain
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          data = subprocess.check_output(['xcodebuild', '-version']) + subprocess.check_output(['swift', '--version'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('key=' + hashlib.sha256(data).hexdigest()[:16] + '\n')
          PY
      - name: Cache native test compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build
          key: native-spm-v2-tests-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/hap-swift/Package.swift', 'Vendor/MenuBarMijia/Package.swift') }}-${{ hashFiles('Sources/**', 'Tests/**', 'Vendor/hap-swift/Sources/**', 'Vendor/MenuBarMijia/Sources/**', 'Vendor/MenuBarMijia/Tests/**') }}
          restore-keys: |
            native-spm-v2-tests-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/hap-swift/Package.swift', 'Vendor/MenuBarMijia/Package.swift') }}-
      - name: Run MijiaCore Release tests
        run: |
          mkdir -p build/ci-tests/logs
          swift test --package-path Vendor/MenuBarMijia --scratch-path "$PWD/.build/mijiacore-tests" \
            -c release --force-resolved-versions 2>&1 | tee build/ci-tests/logs/mijiacore-tests.log
      - name: Run Release tests
        run: |
          mkdir -p build/ci-tests/logs
          swift test -c release --force-resolved-versions 2>&1 | tee build/ci-tests/logs/tests.log
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ci-test-logs
          path: build/ci-tests/logs/
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
      run_id: ${{ github.run_id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record toolchain and validate metadata
        id: metadata
        run: |
          xcodebuild -version
          swift --version
          python3 scripts/release_metadata.py --github-output "$GITHUB_OUTPUT"
          python3 -m unittest discover -s scripts/tests -v
          for script in scripts/*.sh scripts/ci/*.sh; do bash -n "$script"; done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('scripts').rglob('*.py'):
              compile(path.read_text(), str(path), 'exec')
          PY
      - name: Identify compiler and SDK
        id: toolchain
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          data = subprocess.check_output(['xcodebuild', '-version']) + subprocess.check_output(['swift', '--version'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('key=' + hashlib.sha256(data).hexdigest()[:16] + '\n')
          PY
      - name: Cache Universal compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build
          key: native-spm-v2-universal-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/hap-swift/Package.swift', 'Vendor/MenuBarMijia/Package.swift') }}-${{ hashFiles('Sources/**', 'Tests/**', 'Vendor/hap-swift/Sources/**', 'Vendor/MenuBarMijia/Sources/**', 'Vendor/MenuBarMijia/Tests/**') }}
          restore-keys: |
            native-spm-v2-universal-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/hap-swift/Package.swift', 'Vendor/MenuBarMijia/Package.swift') }}-
      - name: Build and archive Universal app
        env:
          MIJIALAN_UNIVERSAL: '1'
          MIJIALAN_APP_OUTPUT: ${{ github.workspace }}/build/ci/MijiaLAN.app
          MIJIALAN_DSYM_OUTPUT: ${{ github.workspace }}/build/ci/MijiaLAN.app.dSYM
          STEM: ${{ steps.metadata.outputs.stem }}
        run: |
          mkdir -p build/ci/logs
          scripts/build_app.sh release 2>&1 | tee build/ci/logs/build.log
          python3 scripts/swift_runtime.py verify "$MIJIALAN_APP_OUTPUT" --report build/ci/logs/runtime.json
          python3 scripts/ci/ci_artifact.py archive --directory build/ci/dist \
            --app "$MIJIALAN_APP_OUTPUT" --symbols "$MIJIALAN_DSYM_OUTPUT"
      - name: Upload CI package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ci-universal
          path: build/ci/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ci-logs
          path: build/ci/logs/
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    needs: [tests, build]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/native-smoke.yml
    with:
      artifact_name: native-ci-universal
