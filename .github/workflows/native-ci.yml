name: Native macOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record toolchain and validate metadata
        id: metadata
        run: |
          xcodebuild -version
          swift --version
          python3 scripts/release_metadata.py --github-output "$GITHUB_OUTPUT"
          python3 -m unittest discover -s scripts/tests -v
          for script in scripts/*.sh scripts/ci/*.sh; do bash -n "$script"; done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('scripts').rglob('*.py'):
              compile(path.read_text(), str(path), 'exec')
          PY
      - name: Cache SwiftPM dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
          key: native-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode27.1-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/hap-swift/Package.swift') }}
      - name: Run Release tests
        run: |
          mkdir -p build/ci/logs
          swift test -c release --force-resolved-versions 2>&1 | tee build/ci/logs/tests.log
      - name: Build and archive Universal app
        env:
          MIJIALAN_UNIVERSAL: '1'
          MIJIALAN_APP_OUTPUT: ${{ github.workspace }}/build/ci/MijiaLAN.app
          STEM: ${{ steps.metadata.outputs.stem }}
        run: |
          scripts/build_app.sh release 2>&1 | tee build/ci/logs/build.log
          python3 scripts/swift_runtime.py verify "$MIJIALAN_APP_OUTPUT" --report build/ci/logs/runtime.json
          mkdir -p build/ci/dist
          ditto -c -k --sequesterRsrc --keepParent "$MIJIALAN_APP_OUTPUT" "build/ci/dist/$STEM.zip"
          (cd build/ci/dist && shasum -a 256 "$STEM.zip" > SHA256SUMS.txt)
      - name: Upload CI package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ci-universal
          path: build/ci/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ci-logs
          path: build/ci/logs/
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    needs: build
    uses: ./.github/workflows/native-smoke.yml
    with:
      artifact_name: native-ci-universal
