name: Native package compatibility

on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: true
      notarized:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: macOS 15 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/native-package
      - name: Verify and launch the packaged app
        env:
          NOTARIZED: ${{ inputs.notarized }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          [[ "$(uname -m)" == "$EXPECTED_ARCH" ]]
          args=()
          if [[ "$NOTARIZED" == true ]]; then args+=(--notarized); fi
          if [[ "$EXPECTED_ARCH" == x86_64 ]]; then args+=(--startup-only); fi
          python3 scripts/ci/smoke_app.py "$RUNNER_TEMP/native-package" \
            --evidence "$RUNNER_TEMP/native-smoke" "${args[@]}"
      - name: Preserve startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_name }}-macos15-${{ matrix.arch }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-smoke/
          if-no-files-found: ignore
          retention-days: 14
