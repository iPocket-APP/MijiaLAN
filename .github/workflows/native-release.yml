name: Native signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all package checks pass, creating the version tag if needed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: xcode-27
    environment: macos-release
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      MIJIALAN_SIGN_IDENTITY: ${{ vars.MIJIALAN_SIGNING_IDENTITY }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and metadata
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          args=()
          if [[ "$REF_TYPE" == tag ]]; then args+=(--tag "$REF_NAME"); fi
          python3 scripts/release_metadata.py --github-output "$GITHUB_OUTPUT" "${args[@]}"
          version="$(python3 scripts/release_metadata.py version)"
          test -s "docs/releases/v$version.md"
          xcodebuild -version
          swift --version
      - name: Cache SwiftPM dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
          key: native-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode27.1-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/hap-swift/Package.swift') }}
      - name: Import temporary signing materials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: bash scripts/ci/setup_signing.sh
      - name: Test, build, sign and notarize
        run: scripts/package_release.sh
      - name: Remove signing materials
        if: always()
        run: bash scripts/ci/cleanup_signing.sh
      - name: Upload distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-universal
          path: ${{ steps.metadata.outputs.release_dir }}/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Archive matching crash symbols
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.release_dir }}
        run: tar -czf "$RELEASE_DIR/symbols.tar.gz" -C "$RELEASE_DIR/symbols" MijiaLAN.app.dSYM
      - name: Upload crash symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-symbols
          path: ${{ steps.metadata.outputs.release_dir }}/symbols.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve packaging logs
        if: always() && steps.metadata.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-logs
          path: ${{ steps.metadata.outputs.release_dir }}/logs/
          if-no-files-found: ignore
          retention-days: 30

  compatibility:
    needs: package
    uses: ./.github/workflows/native-smoke.yml
    with:
      artifact_name: native-release-universal
      notarized: true

  publish:
    needs: [package, compatibility]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-release-universal
          path: dist
      - name: Publish verified assets
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            [[ "$(git rev-parse HEAD)" == "$(git rev-list -n 1 "$RELEASE_TAG")" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          stem="MijiaLAN-$RELEASE_VERSION-universal"
          state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$state" == false ]]; then
            echo 'This version is already public; use a new version instead of replacing published files.' >&2
            exit 1
          fi
          if [[ "$state" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "MijiaLAN $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "MijiaLAN $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" "dist/$stem.dmg" "dist/$stem.zip" dist/SHA256SUMS.txt --clobber
          [[ "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" == 3 ]]
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
