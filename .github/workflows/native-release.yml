name: Native signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all package checks pass, creating the version tag if needed
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      run_id: ${{ steps.lookup.outputs.run_id }}
      artifact_id: ${{ steps.lookup.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject mismatched or already published versions early
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          args=()
          if [[ "$REF_TYPE" == tag ]]; then args+=(--tag "$REF_NAME"); fi
          python3 scripts/release_metadata.py "${args[@]}"
          version="$(python3 scripts/release_metadata.py version)"
          test -s "docs/releases/v$version.md"
          state="$(gh release view "v$version" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$PUBLISH" == true && "$state" == false ]]; then
            echo 'This version is already public; bump release.json first.' >&2
            exit 1
          fi
      - name: Reuse the exact commit's successful CI build
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/find_ci_artifact.py --github-output "$GITHUB_OUTPUT"

  compile:
    needs: resolve
    if: needs.resolve.outputs.artifact_id == ''
    uses: ./.github/workflows/native-ci.yml

  package:
    needs: [resolve, compile]
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.compile.result == 'success' || needs.compile.result == 'skipped')
    runs-on: macos-26
    environment: macos-release
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      MIJIALAN_SIGN_IDENTITY: ${{ vars.MIJIALAN_SIGNING_IDENTITY }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and metadata
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          args=()
          if [[ "$REF_TYPE" == tag ]]; then args+=(--tag "$REF_NAME"); fi
          python3 scripts/release_metadata.py --github-output "$GITHUB_OUTPUT" "${args[@]}"
          version="$(python3 scripts/release_metadata.py version)"
          test -s "docs/releases/v$version.md"
          xcodebuild -version
          swift --version
      - name: Download the verified CI build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id || needs.compile.outputs.artifact_id }}
          run-id: ${{ needs.resolve.outputs.run_id || needs.compile.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-ci-input
          merge-multiple: true
      - name: Verify provenance and stage the existing app
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.release_dir }}
          CI_RUN_ID: ${{ needs.resolve.outputs.run_id || needs.compile.outputs.run_id }}
        run: |
          python3 scripts/ci/ci_artifact.py promote --directory "$RUNNER_TEMP/native-ci-input" \
            --app "$RELEASE_DIR/staging/MijiaLAN.app" --symbols "$RELEASE_DIR/symbols/MijiaLAN.app.dSYM" \
            --run-id "$CI_RUN_ID"
          mkdir -p "$RELEASE_DIR/logs"
          cp "$RUNNER_TEMP/native-ci-input/provenance.json" "$RELEASE_DIR/logs/ci-provenance.json"
      - name: Import temporary signing materials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: bash scripts/ci/setup_signing.sh
      - name: Sign and notarize without recompiling
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.release_dir }}
        run: |
          bash scripts/ci/resign_app.sh "$RELEASE_DIR/staging/MijiaLAN.app"
          scripts/package_release.sh --package-existing
      - name: Prepare signed update feed from the notarized ZIP
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.release_dir }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          python3 scripts/sparkle_updates.py fetch-tools "$RUNNER_TEMP/sparkle-tools"
          python3 scripts/sparkle_updates.py prepare-feed \
            --app "$RELEASE_DIR/staging/MijiaLAN.app" \
            --archive "$RELEASE_DIR/dist/MijiaLAN-$RELEASE_VERSION-universal.zip" \
            --notes "docs/releases/v$RELEASE_VERSION.md" \
            --output "$RELEASE_DIR/updates" --tools "$RUNNER_TEMP/sparkle-tools/bin"
      - name: Remove signing materials
        if: always()
        run: bash scripts/ci/cleanup_signing.sh
      - name: Upload update feed separately from the download packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-update-feed
          path: ${{ steps.metadata.outputs.release_dir }}/updates/
          if-no-files-found: error
          retention-days: 14
      - name: Upload distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-universal
          path: ${{ steps.metadata.outputs.release_dir }}/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Archive matching crash symbols
        env:
          RELEASE_DIR: ${{ steps.metadata.outputs.release_dir }}
        run: tar -czf "$RELEASE_DIR/symbols.tar.gz" -C "$RELEASE_DIR/symbols" MijiaLAN.app.dSYM
      - name: Upload crash symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-symbols
          path: ${{ steps.metadata.outputs.release_dir }}/symbols.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve packaging logs
        if: always() && steps.metadata.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-logs
          path: ${{ steps.metadata.outputs.release_dir }}/logs/
          if-no-files-found: ignore
          retention-days: 30

  compatibility:
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    uses: ./.github/workflows/native-smoke.yml
    with:
      artifact_name: native-release-universal
      notarized: true

  publish:
    needs: [package, compatibility]
    if: >-
      !cancelled() && needs.package.result == 'success' &&
      needs.compatibility.result == 'success' &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
      RELEASE_VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-release-universal
          path: dist
      - name: Publish verified assets
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            [[ "$(git rev-parse HEAD)" == "$(git rev-list -n 1 "$RELEASE_TAG")" ]]
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          fi
          (cd dist && sha256sum --check SHA256SUMS.txt)
          stem="MijiaLAN-$RELEASE_VERSION-universal"
          state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$state" == false ]]; then
            echo 'This version is already public; use a new version instead of replacing published files.' >&2
            exit 1
          fi
          if [[ "$state" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "MijiaLAN $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "MijiaLAN $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" "dist/$stem.dmg" "dist/$stem.zip" dist/SHA256SUMS.txt --clobber
          [[ "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" == 3 ]]
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

  deploy-updates:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: mijialan-update-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-update-feed
          path: updates
      - name: Preserve all verified Rust platform feeds when updating the native feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_site.py --native-feed updates/appcast.xml --output site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Publish feed only after the release is public
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify every public update path
        run: python3 scripts/update_site.py --output site --check-live
