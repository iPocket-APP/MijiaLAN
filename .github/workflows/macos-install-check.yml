name: macOS install check

# Installs published releases the way a person does and records what appears on screen:
# Gatekeeper verdicts, whether the app stays running, its menu-bar icon, and the panel.
on:
  push:
    branches: ['diag/macos-install-check']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-install-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  install:
    name: ${{ matrix.tag }} · ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26]
        tag: [v0.1.1, v0.1.2, v0.1.3]
        include:
          - { runner: macos-15, tag: rs-v0.1.0-b11 }
          - { runner: macos-26, tag: rs-v0.1.0-b11 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the window probe
        run: xcrun swiftc -O scripts/ci/window_probe.swift -o "$RUNNER_TEMP/window_probe"
      - name: Install and open ${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
        run: python3 scripts/ci/install_check.py --tag "$TAG" --probe "$RUNNER_TEMP/window_probe" --evidence "$RUNNER_TEMP/evidence"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: install-${{ matrix.tag }}-${{ matrix.runner }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 14
