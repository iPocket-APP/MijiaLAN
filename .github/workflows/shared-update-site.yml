name: Refresh shared update feeds
run-name: Refresh update feeds · ${{ inputs.source_release || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      source_release:
        description: Published Rust tag that requested this refresh (for tracing only)
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: mijialan-update-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Rebuild every flavor from verified public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_site.py --output site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify native and Rust public feeds after deployment
        run: python3 scripts/update_site.py --output site --check-live
