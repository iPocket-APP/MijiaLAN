name: TV experimental build

on:
  push:
    branches: [MijiaLAN-tvOS]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare dependencies and tools
        run: |
          xcodebuild -version
          swift --version
          command -v xcodegen || brew install xcodegen
          python3 Experiments/AppleTV/prepare.py
      - name: Test shared TV runtime and native mappings
        run: |
          swift test --package-path Experiments/AppleTV --scratch-path build/tvos-tests --force-resolved-versions
          swift test --scratch-path build/native-mapping-tests --force-resolved-versions \
            --filter 'DeviceCapabilityTests|CapabilityMappingTests|CategoryMappingTests'
      - name: Archive real tvOS arm64 Release app and tunnel
        run: bash Experiments/AppleTV/build.sh unsigned-archive
      - name: Package and verify sideloading entitlement templates
        run: |
          python3 Experiments/AppleTV/package_unsigned.py \
            --archive build/MijiaLANTVPrototype-unsigned.xcarchive \
            --checkouts build/tvos-prototype-derived/SourcePackages/checkouts \
            --output build/tvos-dist
          python3 Experiments/AppleTV/verify_sideload.py build/tvos-dist/*.ipa --template \
            --report build/tvos-dist/sideload-template-check.json
          for ipa in build/tvos-dist/*.ipa
          do
            MIJIALAN_SIDELOAD_TEST_IPA="$ipa" python3 -m unittest discover \
              -s Experiments/AppleTV/Tests/Python -v
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tvos-sideload-self-signing
          path: build/tvos-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
