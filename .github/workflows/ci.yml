name: Build
run-name: Build · ${{ inputs.platform || 'all' }} · ${{ github.sha }}

on:
  push:
    branches: [MijiaLAN-rs]
  pull_request:
    branches: [MijiaLAN-rs]
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to verify and package
        type: choice
        default: all
        options: [all, release, windows, macos-arm64, macos-intel]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Check formatting and release helper tests
        run: |
          cargo fmt --all --check
          python3 -m unittest discover -s scripts/ci/tests -v
          python3 -m unittest discover -s scripts/tests -v
      - id: matrix
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: python3 scripts/ci/build_artifact.py matrix "$PLATFORM"

  build:
    needs: plan
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up packaging Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Xcode and Metal
        if: runner.os == 'macOS'
        run: |
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          echo "LIBCLANG_PATH=$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Locate shader compiler
        if: runner.os == 'Windows'
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem $sdk -Filter fxc.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: clippy
          targets: ${{ matrix.target }}
      - name: Normalize unchanged vendored sources
        id: vendor
        run: ${{ matrix.python }} scripts/ci/build_artifact.py vendor
      - name: Compute compiler-input cache key
        id: keys
        run: ${{ matrix.python }} scripts/ci/build_artifact.py cache-keys --target ${{ matrix.target }} --compiler "${{ steps.rust.outputs.cachekey }}"
      - name: Restore complete Cargo cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.keys.outputs.key }}
          restore-keys: ${{ steps.keys.outputs.prefix }}
      - name: Seed from previous dependency cache during migration
        if: steps.rust-cache.outputs.cache-matched-key == ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-v3-${{ matrix.target }}-xcode26.3-${{ steps.vendor.outputs.tree }}
          cache-workspace-crates: true
          cache-all-crates: true
          cache-bin: false
          save-if: false
          env-vars: MACOSX_DEPLOYMENT_TARGET DEVELOPER_DIR VCToolsVersion WindowsSDKVersion GPUI_FXC_PATH
      - name: Reuse unchanged compiler inputs
        run: ${{ matrix.python }} scripts/ci/build_artifact.py freshness

      - name: Clippy Release
        run: cargo clippy --locked --release --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Test Release on native target
        if: runner.os == 'macOS'
        run: cargo test --locked --release --workspace --target ${{ matrix.target }} --timings 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Test Release on native target
        if: runner.os == 'Windows'
        run: |
          cargo test --locked --release --workspace --target ${{ matrix.target }} --timings 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/tests.log"
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed' }

      - name: Package macOS Release
        if: runner.os == 'macOS'
        env:
          MIJIALAN_BUILD_NUMBER: ${{ github.run_number }}
          MIJIALAN_APP_OUTPUT: ${{ github.workspace }}/build/ci/MijiaLAN.app
          MIJIALAN_APP_NAME: MijiaLAN
          MIJIALAN_SIGNING_IDENTITY: '-'
          MIJIALAN_MACOS_TARGET: ${{ matrix.target }}
          CI_ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/build-macos.sh release
          app="$MIJIALAN_APP_OUTPUT"
          cargo metadata --locked --format-version 1 --filter-platform "$MIJIALAN_MACOS_TARGET" > "$RUNNER_TEMP/cargo-metadata.json"
          python3 scripts/collect-cargo-licenses.py "$RUNNER_TEMP/cargo-metadata.json" "$app/Contents/Resources/Licenses/Cargo"
          codesign --force --sign - --timestamp=none "$app"
          for binary in mijialan-rust mijia-rust; do
            lipo "$app/Contents/MacOS/$binary" -verify_arch "$CI_ARCH"
          done
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/mijialan-rust" --updater-smoke
          version="$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          name="MijiaLAN-Rust-$version-macos-$CI_ARCH"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" "artifacts/$name.zip"
          (cd artifacts && shasum -a 256 "$name.zip" > "$name.sha256")
          ditto -x -k "artifacts/$name.zip" "$RUNNER_TEMP/package-smoke"
          cli="$RUNNER_TEMP/package-smoke/MijiaLAN.app/Contents/MacOS/mijia-rust"
          "$cli" --help
          "$cli" --demo list > "$RUNNER_TEMP/demo-devices.json"
          python3 -c 'import json,sys; assert len(json.load(open(sys.argv[1]))) == 4' "$RUNNER_TEMP/demo-devices.json"

      - name: Package Windows Release
        if: runner.os == 'Windows'
        run: |
          ./scripts/build-windows.ps1 -Profile release -Target x86_64-pc-windows-msvc
          $zip = Get-Item artifacts/*-windows-x86_64.zip
          $smoke = Join-Path $env:RUNNER_TEMP 'package-smoke'
          Expand-Archive -Path $zip.FullName -DestinationPath $smoke
          $cli = Join-Path $smoke "$($zip.BaseName)/mijia-rust.exe"
          & $cli --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI help failed' }
          $output = & $cli --demo list
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI demo failed' }
          $devices = ConvertFrom-Json -InputObject ($output -join "`n")
          if ($devices.Count -ne 4) { throw 'Demo returned unexpected devices' }
          $desktop = Join-Path $smoke "$($zip.BaseName)/mijialan-rust.exe"
          $probe = Start-Process -FilePath $desktop -ArgumentList '--updater-smoke' -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw 'Bundled WinSparkle runtime smoke check failed' }
      - name: Record verified package provenance
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: ${{ matrix.python }} scripts/ci/build_artifact.py record --target ${{ matrix.target }} --tests "${{ runner.temp }}/tests.log"
      - name: Upload packages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MijiaLAN-Rust-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Save complete Cargo cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/MijiaLAN-rs' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.keys.outputs.key }}
