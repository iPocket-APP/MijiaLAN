name: Signed desktop release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Positive build number (unused when source_ref already contains the build)
        type: string
        default: ''
      source_ref:
        description: Optional rs-vVERSION-bBUILD tag; empty uses current MijiaLAN-rs commit
        type: string
        default: ''
      ci_run_id:
        description: Optional exact Build run ID for this source commit
        type: string
        default: '0'
      linux_run_id:
        description: Successful Linux and NAS run on the same commit (unified public release)
        type: string
        default: ''
      publish:
        description: Publish a public Rust release after verification (false produces preview artifacts only)
        type: boolean
        default: false
      stable:
        description: Mark the published Rust release as stable
        type: boolean
        default: false
  push:
    tags: ['rs-v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-desktop-${{ inputs.source_ref || github.ref }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/MijiaLAN-rs') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rs-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      build_number: ${{ steps.source.outputs.build_number }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: MijiaLAN-rs
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tested source packages
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref || (github.ref_type == 'tag' && github.ref_name) || '' }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CI_RUN_ID: ${{ inputs.ci_run_id || '0' }}
        run: python3 scripts/ci/release.py resolve --ref "$SOURCE_REF" --build "$BUILD_NUMBER" --run "$CI_RUN_ID"

  macos:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ (matrix.arch == 'arm64' && vars.MIJIALAN_MACOS_RUNNER) || (matrix.arch == 'x86_64' && vars.MIJIALAN_MACOS_INTEL_RUNNER) || matrix.runner }}
    concurrency:
      group: mijialan-macos-signing-${{ matrix.arch }}
      cancel-in-progress: false
    environment: macos-release
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MIJIALAN_BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
      MIJIALAN_MACOS_ARCH: ${{ matrix.arch }}
      MIJIALAN_SIGNING_IDENTITY: ${{ vars.MIJIALAN_SIGNING_IDENTITY }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - name: Set up packaging Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download validated macOS binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: MijiaLAN-Rust-macOS-${{ matrix.arch }}
          path: build/ci-input
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Select signing tools
        run: |
          [[ "$(uname -m)" == "$MIJIALAN_MACOS_ARCH" ]] || { echo 'Signing runner architecture mismatch' >&2; exit 1; }
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcrun notarytool --version
      - name: Import temporary signing materials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: bash scripts/ci/setup-macos-signing.sh
      - name: Sign and notarize existing CI program
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          python3 scripts/ci/build_artifact.py prepare-mac --folder build/ci-input --source "$SOURCE_SHA" --build "$MIJIALAN_BUILD_NUMBER" --arch "$MIJIALAN_MACOS_ARCH"
          bash scripts/package-macos-release.sh --package-existing
          cli="build/releases/v$VERSION-rs.$MIJIALAN_BUILD_NUMBER/staging/MijiaLAN.app/Contents/MacOS/mijia-rust"
          "${cli%/mijia-rust}/mijialan-rust" --updater-smoke
          "$cli" --help
          "$cli" --demo list > "$RUNNER_TEMP/demo.json"
          python3 -c 'import json,sys; assert len(json.load(open(sys.argv[1]))) == 4' "$RUNNER_TEMP/demo.json"
      - name: Clean up signing materials
        if: always()
        run: bash scripts/ci/cleanup-macos-signing.sh
      - name: Upload signed distribution
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signed-macos-${{ matrix.arch }}
          path: build/releases/v${{ needs.source.outputs.version }}-rs.${{ needs.source.outputs.build_number }}/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  linux:
    needs: source
    if: ${{ inputs.publish && inputs.linux_run_id }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.linux_run_id }}
      MIJIALAN_LINUX_BUILD: ${{ needs.source.outputs.build_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - run: python3 scripts/ci/linux_release.py resolve
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: MijiaLAN-Linux-x86_64-b${{ env.MIJIALAN_LINUX_BUILD }}
          path: build/linux-input
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: MijiaLAN-NAS-x86_64-b${{ env.MIJIALAN_LINUX_BUILD }}-test
          path: build/nas-input
          run-id: ${{ inputs.linux_run_id }}
          github-token: ${{ github.token }}
      - run: python3 scripts/ci/linux_release.py stage build/linux-input build/linux-dist --nas build/nas-input
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verified-linux-distribution
          path: build/linux-dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  distribution:
    needs: [source, macos, linux]
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.macos.result == 'success' &&
      (needs.linux.result == 'success' || (!inputs.linux_run_id && needs.linux.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: macos-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signed-macos-arm64
          path: build/signed-macos/arm64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: signed-macos-x86_64
          path: build/signed-macos/x86_64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: MijiaLAN-Rust-Windows-x86_64
          path: build/windows-input
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: ${{ needs.linux.result == 'success' }}
        with:
          name: verified-linux-distribution
          path: build/linux-dist
      - name: Verify and collect distribution
        env:
          RUST_UPDATE_PRIVATE_KEY: ${{ secrets.RUST_UPDATE_PRIVATE_KEY }}
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          VERSION: ${{ needs.source.outputs.version }}
          BUILD: ${{ needs.source.outputs.build_number }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wixl msitools
          linux=()
          if [[ -d build/linux-dist ]]; then linux=(--linux build/linux-dist); fi
          python3 scripts/ci/release.py collect --source "$SOURCE_SHA" --version "$VERSION" --build "$BUILD" --windows build/windows-input --mac build/signed-macos "${linux[@]}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MijiaLAN-rs-${{ needs.source.outputs.version }}-b${{ needs.source.outputs.build_number }}-preview
          path: distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  publish:
    needs: [source, distribution]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: MijiaLAN-rs-${{ needs.source.outputs.version }}-b${{ needs.source.outputs.build_number }}-preview
          path: distribution
      - name: Publish verified Rust release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          VERSION: ${{ needs.source.outputs.version }}
          BUILD: ${{ needs.source.outputs.build_number }}
          BUILD_RUN: ${{ needs.source.outputs.run_id }}
          LINUX_RUN: ${{ inputs.linux_run_id }}
          STABLE: ${{ inputs.stable }}
        run: |
          flags=()
          if [[ -n "$LINUX_RUN" ]]; then flags+=(--linux-run "$LINUX_RUN"); fi
          if [[ "$STABLE" == true ]]; then flags+=(--stable); fi
          python3 scripts/ci/release.py publish --source "$SOURCE_SHA" --version "$VERSION" --build "$BUILD" --run "$BUILD_RUN" "${flags[@]}"

  refresh-updates:
    needs: [source, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          persist-credentials: false
      - name: Refresh and verify the shared domain from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: python3 scripts/ci/release.py refresh-site --tag "$RELEASE_TAG"
