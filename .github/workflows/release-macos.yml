name: Signed macOS release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Positive build number for this experience package
        required: true
        default: '8'
        type: string
  push:
    tags:
      - 'rs-v*'

permissions:
  contents: read

concurrency:
  group: signed-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/MijiaLAN-rs') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rs-v'))
    runs-on: macos-26-intel
    concurrency:
      group: mijialan-macos-hosted
      cancel-in-progress: false
    environment: macos-release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      MIJIALAN_MACOS_TARGET: aarch64-apple-darwin
      MIJIALAN_TEST_PROFILE: debug
      MIJIALAN_SIGNING_IDENTITY: ${{ vars.MIJIALAN_SIGNING_IDENTITY }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and version
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/MijiaLAN-rs
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^rs-v([0-9]+\.[0-9]+\.[0-9]+)-b([1-9][0-9]*)$ ]] || { echo 'Use rs-vVERSION-bBUILD tags' >&2; exit 1; }
            [[ "${BASH_REMATCH[1]}" == "$version" ]] || { echo 'Tag does not match Cargo version' >&2; exit 1; }
            build_number="${BASH_REMATCH[2]}"
          else
            build_number="$REQUESTED_BUILD_NUMBER"
          fi
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]] || { echo 'Expected a positive build number' >&2; exit 1; }
          echo "MIJIALAN_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "MIJIALAN_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: signed-macos-aarch64-apple-darwin
          cache-on-failure: true

      - name: Set up Xcode and Metal
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Import temporary signing materials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: bash scripts/ci/setup-macos-signing.sh

      - name: Build, sign and notarize
        run: bash scripts/package-macos-release.sh

      - name: Upload distribution files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MijiaLAN-rs-${{ env.MIJIALAN_RELEASE_VERSION }}-b${{ env.MIJIALAN_BUILD_NUMBER }}-macos-arm64
          path: |
            build/releases/v${{ env.MIJIALAN_RELEASE_VERSION }}-rs.${{ env.MIJIALAN_BUILD_NUMBER }}/dist/*.dmg
            build/releases/v${{ env.MIJIALAN_RELEASE_VERSION }}-rs.${{ env.MIJIALAN_BUILD_NUMBER }}/dist/*.zip
            build/releases/v${{ env.MIJIALAN_RELEASE_VERSION }}-rs.${{ env.MIJIALAN_BUILD_NUMBER }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Clean up signing materials
        if: always()
        run: bash scripts/ci/cleanup-macos-signing.sh

      - name: Preserve signed app after packaging failure
        if: failure()
        run: |
          [[ -n "${MIJIALAN_RELEASE_VERSION:-}" && -n "${MIJIALAN_BUILD_NUMBER:-}" ]] || exit 0
          release="build/releases/v${MIJIALAN_RELEASE_VERSION}-rs.${MIJIALAN_BUILD_NUMBER}"
          app="$release/staging/MijiaLAN.app"
          if [[ -d "$app" ]] && codesign --verify --deep --strict "$app"; then
            mkdir -p "$release/recovery"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$release/recovery/MijiaLAN-signed-app.zip"
            (cd "$release/recovery" && shasum -a 256 MijiaLAN-signed-app.zip > SHA256SUMS.txt)
          fi

      - name: Upload packaging recovery
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MijiaLAN-rs-${{ env.MIJIALAN_RELEASE_VERSION }}-b${{ env.MIJIALAN_BUILD_NUMBER }}-recovery
          path: |
            build/releases/v${{ env.MIJIALAN_RELEASE_VERSION }}-rs.${{ env.MIJIALAN_BUILD_NUMBER }}/recovery/*.zip
            build/releases/v${{ env.MIJIALAN_RELEASE_VERSION }}-rs.${{ env.MIJIALAN_BUILD_NUMBER }}/recovery/SHA256SUMS.txt
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
